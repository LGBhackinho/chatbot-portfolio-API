services:
  chatbot-backend:
    build: .
    container_name: chatbot-backend
    restart: unless-stopped
    env_file:
      - .env
    # On lie le port uniquement au localhost du NUC pour que le reverse proxy seul y accède
    ports:
      - "192.168.1.22:8001:8000"
    security_opt:
      - no-new-privileges:true